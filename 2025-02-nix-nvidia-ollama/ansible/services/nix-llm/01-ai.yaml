  #     - TS_USERSPACE=true
  #   volumes:
  #     - /opt/appdata/openwebui/tailscale/state:/var/lib/tailscale
  #     - /opt/appdata/openwebui/tailscale/config:/config
  #   restart: unless-stopped

networks:
  ai-stack:
    driver: bridge
