services:
  # AI
  ollama:
    image: ollama/ollama
    container_name: ollama
    tty: true
    stdin_open: true
    volumes:
      - "/opt/appdata/apps/ollama:/root/.ollama"
    ports:
      - 11434:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              capabilities:
                - gpu
              device_ids:
                - nvidia.com/gpu=all
    networks:
      - ai-stack
    restart: always
    command: bash -c "sleep 5 && ollama serve"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=-1
    # Add a formal healthcheck so the stack knows when it's ACTUALLY ready
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 0"]
      interval: 30s
      timeout: 20s        # Increased: Loading 17GB models can lag the API
      retries: 5
      start_period: 300s  # 5 minutes: Be extremely patient on cold boots

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    ports:
      - 8080:8080
    # network_mode: service:ts-openwebui
    volumes:
      - "/opt/appdata/openwebui/data:/app/backend/data"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    networks:
      - ai-stack
    restart: always

  # ts-openwebui:
  #   image: ghcr.io/tailscale/tailscale:latest
  #   container_name: ts-beszel-hub
  #   hostname: beszel
  #   environment:
  #     - TS_AUTHKEY=tskey-client-not-a-real-token-Hsi1
  #     - TS_EXTRA_ARGS=--advertise-tags=tag:web
  #     - TS_SERVE_CONFIG=/config/openwebui.json
